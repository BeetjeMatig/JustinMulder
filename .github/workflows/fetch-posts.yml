name: Refresh Substack posts

on:
  schedule:
    - cron: '0 7 * * *'
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch RSS feed from Substack
        run: |
          HTTP=$(curl -sL -o /tmp/feed.xml -w "%{http_code}" \
            -A "Feedly/1.0 (+http://www.feedly.com/fetcher.html; 12 subscribers)" \
            "https://justinmulder.substack.com/feed")
          echo "HTTP status: $HTTP"
          if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
            echo "--- Response body (first 500 chars) ---"
            head -c 500 /tmp/feed.xml
            exit 1
          fi

      - name: Parse RSS to JSON
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET, json, re
          from datetime import datetime

          tree = ET.parse('/tmp/feed.xml')
          root = tree.getroot()
          channel = root.find('channel')

          CONTENT_NS = 'http://purl.org/rss/1.0/modules/content/'

          posts = []
          for item in channel.findall('item'):
              link = item.findtext('link', '').strip()
              slug = link.rstrip('/').split('/')[-1]

              pub_date = item.findtext('pubDate', '')
              try:
                  dt = datetime.strptime(pub_date, '%a, %d %b %Y %H:%M:%S %z')
                  post_date = dt.isoformat()
              except Exception:
                  post_date = pub_date

              # Substack puts the deck/subtitle in <description>, full HTML in <content:encoded>
              subtitle = item.findtext('description', '')
              # Strip any HTML tags that sneak into the subtitle
              subtitle = re.sub(r'<[^>]+>', '', subtitle).strip()

              content_html = item.findtext(f'{{{CONTENT_NS}}}encoded', '')
              words = len(re.sub(r'<[^>]+>', ' ', content_html).split())
              reading_time = max(1, round(words / 200))

              posts.append({
                  'post_date': post_date,
                  'title': item.findtext('title', '').strip(),
                  'subtitle': subtitle,
                  'slug': slug,
                  'canonical_url': link,
                  'reading_time': reading_time,
                  'reactions': {},
              })

          with open('assets/posts.json', 'w') as f:
              json.dump(posts, f, indent=2)

          print(f"Wrote {len(posts)} posts to assets/posts.json")
          EOF

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/posts.json
          git diff --staged --quiet || git commit -m "chore: refresh Substack posts"
          git push
