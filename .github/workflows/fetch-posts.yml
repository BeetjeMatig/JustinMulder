name: Refresh Substack posts

on:
  schedule:
    - cron: '0 7 * * *'
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch posts from Substack
        run: |
          HTTP=$(curl -sL -o assets/posts.json -w "%{http_code}" \
            "https://justinmulder.substack.com/api/v1/posts?limit=50" \
            -H "Accept: application/json")
          echo "HTTP status: $HTTP"
          if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
            echo "--- Response body ---"
            cat assets/posts.json
            exit 1
          fi

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/posts.json
          git diff --staged --quiet || git commit -m "chore: refresh Substack posts"
          git push
